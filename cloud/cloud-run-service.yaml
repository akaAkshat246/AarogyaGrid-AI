apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aarogyagrid-ai-engine
  labels:
    cloud.googleapis.com/location: asia-south1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/aarogyagrid-ai/aarogyagrid-ai:latest
        ports:
        - name: http1
          containerPort: 8000
        resources:
          limits:
            cpu: "2000m"
            memory: "2Gi"
        env:
        - name: APP_ENV
          value: "production"
        - name: STORAGE_BACKEND
          value: "firestore"
        - name: GCP_PROJECT_ID
          value: "aarogyagrid-ai"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-api-key
              key: latest
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 15
